<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">CampusPulse</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="events.html">Events</a>
          <a href="contact.html">Contact</a>
          <a href="admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-card wide-card">
        <h1>Contact the Campus Team</h1>
        <p>Share your questions, event ideas, or registration concerns with us.</p>
        <form id="contactForm" class="auth-form">
          <div class="grid-2">
            <div>
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div>
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>
          </div>
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required />
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>
    </main>

    <script src="js/validation.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
