<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">CampusPulse</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="events.html">Events</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-card wide-card">
        <h1>Create Student Account</h1>
        <p>Join the campus community and register for college events.</p>
        <form id="registerForm" class="auth-form">
          <div class="grid-2">
            <div>
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" required />
            </div>
            <div>
              <label for="rollNumber">Roll Number</label>
              <input type="text" id="rollNumber" name="rollNumber" required />
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label for="department">Department</label>
              <input type="text" id="department" name="department" required />
            </div>
            <div>
              <label for="year">Year</label>
              <input type="number" id="year" name="year" min="1" max="4" required />
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div>
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required />
            </div>
          </div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />

          <button type="submit" class="btn">Register</button>
        </form>
        <p class="helper-text">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </main>

    <script src="js/validation.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
